<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sports Content Scanner v4</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#07090f;color:#dde8f0;font-family:'Inter',system-ui,sans-serif;min-height:100vh}
.hdr{background:#0b0f1a;border-bottom:1px solid #151f30;padding:14px 20px;display:flex;align-items:center;gap:12px}
.hdr-logo{width:36px;height:36px;background:#d4a017;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0}
.hdr-title{font-size:15px;font-weight:800;color:#fff}
.hdr-sub{font-size:11px;color:#3a5a7a;margin-top:1px}
.hdr-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.dot{width:7px;height:7px;border-radius:50%;background:#2a3a2a}
.dot.live{background:#4adb6a;box-shadow:0 0 6px #4adb6a88;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.stxt{font-size:11px;color:#3a5a7a}
.cfg{background:#0a0e1a;border-bottom:1px solid #111a28;padding:10px 20px;display:flex;flex-direction:column;gap:8px}
.cfg-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.cfg-lbl{font-size:10px;font-weight:700;color:#3a5a7a;text-transform:uppercase;letter-spacing:.8px;white-space:nowrap;min-width:80px}
.cfg-inp{background:#07090f;border:1px solid #182030;border-radius:6px;color:#c0d0e0;font-size:12px;padding:6px 10px;font-family:monospace;outline:none;flex:1;min-width:180px;max-width:320px}
.cfg-inp:focus{border-color:#d4a01755}
.cfg-inp::placeholder{color:#2a3a4a}
.cfg-inp.url{max-width:440px;color:#6ababb}
.cfg-save{background:#d4a017;color:#07090f;font-weight:800;font-size:11px;border:none;border-radius:6px;padding:6px 14px;cursor:pointer}
.cfg-save:hover{opacity:.85}
.cfg-badge{font-size:11px;padding:4px 10px;border-radius:5px;display:none}
.cfg-badge.ok{background:#0d2010;color:#4adb6a;border:1px solid #1a4020;display:inline-block}
.cfg-badge.err{background:#1a0808;color:#cc5050;border:1px solid #3a1010;display:inline-block}
.wrap{display:grid;grid-template-columns:230px 1fr;min-height:calc(100vh - 110px)}
.sidebar{background:#090c16;border-right:1px solid #111a28;padding:14px 11px;display:flex;flex-direction:column;gap:13px}
.sl{font-size:10px;font-weight:700;letter-spacing:1.2px;color:#2a4a6a;text-transform:uppercase;margin-bottom:5px}
.sport-grid{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.sport-btn{background:#0f1520;border:1px solid #182030;border-radius:7px;padding:6px 4px;cursor:pointer;text-align:center;transition:all .15s}
.sport-btn:hover{border-color:#d4a01744}
.sport-btn.active{border-color:#d4a017;background:#131810}
.sport-btn .icon{font-size:15px;display:block;margin-bottom:2px}
.sport-btn .name{font-size:9px;font-weight:700;color:#4a6a8a;text-transform:uppercase}
.sport-btn.active .name{color:#d4a017}
.cat-list{display:flex;flex-direction:column;gap:4px}
.cat-btn{background:#0f1520;border:1px solid #182030;border-radius:6px;padding:6px 8px;cursor:pointer;display:flex;align-items:center;gap:7px;transition:all .15s}
.cat-btn:hover{border-color:#d4a01744}
.cat-btn.active{border-color:#d4a017;background:#131810}
.cat-btn .ci{font-size:12px;width:17px;text-align:center;flex-shrink:0}
.cat-btn .cl{font-size:11px;font-weight:600;color:#5a7a8a}
.cat-btn.active .cl{color:#d4a017}
.geo-row{display:flex;gap:4px}
.geo-btn{flex:1;background:#0f1520;border:1px solid #182030;border-radius:6px;padding:5px 3px;cursor:pointer;text-align:center;font-size:10px;font-weight:700;color:#4a6a8a;transition:all .15s}
.geo-btn.active{border-color:#d4a017;color:#d4a017;background:#131810}
.scan-btn{background:#d4a017;color:#07090f;font-weight:900;font-size:12px;border:none;border-radius:8px;padding:10px;cursor:pointer;width:100%;display:flex;align-items:center;justify-content:center;gap:7px;margin-top:auto}
.scan-btn:hover{opacity:.88}
.scan-btn:disabled{opacity:.35;cursor:not-allowed}
.main{display:flex;flex-direction:column;overflow:hidden}
.phases{display:flex;border-bottom:1px solid #111a28;background:#090c16}
.phase{flex:1;padding:8px 4px;text-align:center;font-size:9px;font-weight:700;color:#1a3050;letter-spacing:.6px;text-transform:uppercase;border-bottom:2px solid transparent;transition:all .2s}
.phase.active{color:#d4a017;border-bottom-color:#d4a017}
.phase.done{color:#4adb6a;border-bottom-color:#4adb6a44}
.phase-num{display:block;font-size:13px;font-weight:900;margin-bottom:1px;color:inherit}
.content{flex:1;overflow-y:auto;padding:16px}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:280px;gap:10px;color:#1a3050}
.empty-icon{font-size:44px}
.empty-title{font-size:14px;font-weight:700;color:#2a4a6a}
.empty-sub{font-size:12px;color:#1a3050;text-align:center;max-width:280px;line-height:1.6}
.phase-log{display:flex;flex-direction:column;gap:8px;max-width:460px;margin:28px auto}
.log-item{display:flex;align-items:center;gap:10px;padding:9px 12px;background:#0d1220;border:1px solid #182030;border-radius:8px;transition:all .3s}
.log-item.active{border-color:#d4a01755;background:#131810}
.log-item.done{border-color:#4adb6a33;background:#0d1810}
.log-icon{font-size:13px;width:18px;text-align:center;flex-shrink:0}
.log-text{font-size:11px;color:#5a7a8a;font-weight:600}
.log-item.active .log-text{color:#d4a017}
.log-item.done .log-text{color:#4adb6a}
.log-spin{width:13px;height:13px;border:2px solid #2a3a4a;border-top-color:#d4a017;border-radius:50%;animation:spin .6s linear infinite;margin-left:auto;flex-shrink:0}
.log-check{margin-left:auto;color:#4adb6a;font-size:12px}
@keyframes spin{to{transform:rotate(360deg)}}
.sec-hd{font-size:10px;font-weight:700;color:#2a4a6a;text-transform:uppercase;letter-spacing:1.2px;margin-bottom:9px}
.ev-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.ev-card{background:#0d1220;border:1px solid #182030;border-radius:9px;padding:12px;cursor:pointer;transition:all .15s;position:relative}
.ev-card:hover{border-color:#d4a01755}
.ev-card.picked{border-color:#d4a017;background:#131810}
.ev-rank{position:absolute;top:8px;right:8px;font-size:9px;font-weight:900;color:#d4a017;background:#1a1a08;border:1px solid #d4a01733;border-radius:3px;padding:2px 5px}
.ev-cat{font-size:9px;font-weight:700;color:#d4a017;letter-spacing:.8px;text-transform:uppercase;margin-bottom:4px}
.ev-title{font-size:12px;font-weight:700;color:#dde8f0;line-height:1.4;margin-bottom:4px;padding-right:26px}
.ev-meta{font-size:11px;color:#2a4a6a;line-height:1.5}
.ev-bar-wrap{display:flex;align-items:center;gap:5px;margin-top:6px}
.ev-bar{flex:1;height:3px;background:#182030;border-radius:2px}
.ev-fill{height:3px;border-radius:2px;background:#d4a017}
.ev-num{font-size:10px;font-weight:800;color:#d4a017;width:22px;text-align:right}
.gen-btn{background:#d4a017;color:#07090f;font-weight:900;font-size:12px;border:none;border-radius:7px;padding:9px 18px;cursor:pointer;display:flex;align-items:center;gap:7px;margin-bottom:14px}
.gen-btn:hover{opacity:.88}
.gen-btn:disabled{opacity:.35;cursor:not-allowed}
.out-wrap{border:1px solid #182030;border-radius:10px;overflow:hidden}
.out-tabs{display:flex;border-bottom:1px solid #111a28;overflow-x:auto;background:#090c16}
.otab{padding:8px 13px;font-size:11px;font-weight:700;color:#2a4060;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;transition:color .15s}
.otab:hover{color:#5a7a8a}
.otab.active{color:#d4a017;border-bottom-color:#d4a017}
.out-panel{display:none;padding:14px}
.out-panel.active{display:block}
.sc-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:9px}
.sc-card{background:#0d1220;border:1px solid #182030;border-radius:7px;padding:10px}
.sc-lbl{font-size:9px;font-weight:700;color:#2a4a6a;text-transform:uppercase;letter-spacing:.8px;margin-bottom:4px}
.sc-bar-bg{background:#182030;border-radius:3px;height:4px;margin-bottom:4px}
.sc-bar{height:4px;border-radius:3px;background:#d4a017}
.sc-num{font-size:22px;font-weight:900;color:#d4a017}
.pri-badge{display:inline-block;padding:3px 11px;border-radius:20px;font-size:11px;font-weight:800;letter-spacing:.5px;margin-bottom:8px}
.pri-IMMEDIATE{background:#0d2010;color:#4adb6a;border:1px solid #1a4020}
.pri-BATCH{background:#1a1a08;color:#d4a017;border:1px solid #3a3a10}
.pri-DEPRIORITIZE{background:#1a0808;color:#cc5050;border:1px solid #3a1010}
.rbox{background:#0d1220;border:1px solid #182030;border-radius:7px;padding:10px;font-size:12px;color:#7a9ab0;line-height:1.7}
.hook-card{background:#0d1220;border-left:3px solid #d4a017;border-radius:0 7px 7px 0;padding:10px 12px;margin-bottom:8px}
.hook-lang{font-size:9px;font-weight:700;color:#d4a017;margin-bottom:3px;letter-spacing:.8px}
.hook-text{font-size:15px;font-weight:800;color:#fff;line-height:1.3}
.vo-card{background:#0d1220;border:1px solid #182030;border-radius:7px;padding:10px 12px;margin-bottom:6px}
.vo-lang{font-size:9px;font-weight:700;color:#4a8aaa;margin-bottom:4px;letter-spacing:.8px}
.vo-text{font-size:12px;color:#9ab8cc;line-height:1.7}
.caps-row{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px}
.cap-pill{background:#131e2e;border:1px solid #1e2e44;border-radius:5px;padding:4px 9px;font-size:10px;font-weight:900;color:#ddeeff;letter-spacing:1px}
.cta-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.cta-card{background:#0b1828;border:1px solid #182a3a;border-radius:7px;padding:9px 10px}
.cta-lang{font-size:9px;font-weight:700;color:#4a8aaa;margin-bottom:3px;letter-spacing:.8px}
.cta-text{font-size:12px;color:#7aaabb;line-height:1.5}
.subhd{font-size:10px;font-weight:700;color:#2a4a6a;text-transform:uppercase;letter-spacing:.8px;margin:12px 0 7px}
.scene-card{background:#0d1220;border:1px solid #182030;border-radius:8px;padding:10px 12px;margin-bottom:8px}
.sc-hdr{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.sc-idx{width:22px;height:22px;background:#d4a01722;border:1px solid #d4a01744;border-radius:50%;font-size:10px;font-weight:900;color:#d4a017;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.sc-name{font-size:11px;font-weight:800;color:#dde8f0;text-transform:uppercase;letter-spacing:.5px}
.sc-tc{margin-left:auto;font-size:10px;color:#2a4a6a}
.sc-meta{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:6px}
.meta-tag{background:#0b1220;border:1px solid #182030;border-radius:3px;padding:2px 6px;font-size:10px;font-weight:600;color:#3a6a8a}
.sc-cap{background:#0b1828;border:1px solid #182a3a;border-radius:4px;padding:3px 8px;font-size:10px;font-weight:900;color:#ddeeff;letter-spacing:1px;margin-bottom:5px;display:inline-block}
.sc-prompt{font-size:11px;color:#5a8090;line-height:1.65}
.hf-panel{background:#080e18;border:1px solid #1a2a3a;border-radius:9px;padding:14px;margin-top:14px}
.hf-title{font-size:12px;font-weight:800;color:#5ababb;margin-bottom:12px}
.hf-scene-list{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.hf-scene-row{display:flex;align-items:center;gap:8px;padding:6px 10px;background:#0d1520;border:1px solid #182030;border-radius:6px;cursor:pointer}
.hf-scene-row.sel{border-color:#d4a01755;background:#111820}
.hf-check{width:15px;height:15px;accent-color:#d4a017;cursor:pointer;flex-shrink:0}
.hf-scene-lbl{font-size:11px;font-weight:600;color:#5a8a9a;flex:1}
.hf-scene-tc{font-size:10px;color:#2a4a5a}
.hf-send-btn{background:#d4a017;color:#07090f;font-weight:900;font-size:12px;border:none;border-radius:7px;padding:10px 16px;cursor:pointer;width:100%;display:flex;align-items:center;justify-content:center;gap:7px}
.hf-send-btn:hover{opacity:.88}
.hf-send-btn:disabled{opacity:.35;cursor:not-allowed}
.job-box{background:#0a1220;border:1px solid #182030;border-radius:8px;padding:10px;margin-bottom:8px}
.job-hdr{display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap}
.job-scene{font-size:11px;font-weight:700;color:#5a7a9a}
.job-stat{font-size:11px;font-weight:600}
.job-stat.q{color:#5a7a9a}.job-stat.p{color:#d4a017}.job-stat.ok{color:#4adb6a}.job-stat.fail{color:#cc5050}
.job-link{font-size:11px;color:#4a9aaa;text-decoration:none;font-weight:600;margin-left:auto}
.job-link:hover{color:#6ababb}
.jspin{width:11px;height:11px;border:2px solid #2a3a4a;border-top-color:#d4a017;border-radius:50%;animation:spin .6s linear infinite;flex-shrink:0;display:inline-block}
.job-video{width:100%;max-height:180px;border-radius:6px;background:#000;display:block;margin-bottom:6px}
.job-prompt{width:100%;background:#07090f;border:1px solid #1a2a3a;border-radius:5px;color:#8aabb0;font-size:11px;padding:7px 9px;font-family:inherit;resize:vertical;min-height:52px;outline:none;margin-bottom:6px}
.regen-btn{background:#1a2a3a;border:1px solid #2a3a4a;color:#6ababb;font-size:11px;font-weight:700;padding:5px 12px;border-radius:5px;cursor:pointer}
.regen-btn:hover{background:#1e3040}
.merge-box{margin-top:14px;padding:12px;background:#080e18;border:1px solid #1a3a2a;border-radius:8px;display:none}
.merge-btn{background:#4adb6a;color:#07090f;font-weight:900;font-size:12px;border:none;border-radius:7px;padding:9px 16px;cursor:pointer;width:100%}
.merge-btn:hover{opacity:.88}
.merge-btn:disabled{opacity:.35;cursor:not-allowed}
.plat-hd{font-size:10px;font-weight:700;color:#2a4a6a;text-transform:uppercase;letter-spacing:.8px;margin-bottom:6px}
.soc-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:13px}
.soc-card{background:#0d1220;border:1px solid #182030;border-radius:7px;padding:10px}
.soc-lang{font-size:9px;font-weight:700;color:#4a8aaa;margin-bottom:4px;letter-spacing:.8px}
.soc-text{font-size:11px;color:#7aaabb;line-height:1.65;white-space:pre-wrap}
.prod-table{background:#0d1220;border:1px solid #182030;border-radius:7px;overflow:hidden;margin-bottom:9px}
.prod-row{display:flex;justify-content:space-between;align-items:center;padding:8px 11px;border-bottom:1px solid #111a28}
.prod-row:last-child{border-bottom:none}
.prod-k{font-size:11px;color:#3a5a7a;font-weight:600}
.prod-v{font-size:11px;color:#b0c8d8;font-weight:600}
.notes-card{background:#13120a;border:1px solid #2a2810;border-radius:7px;padding:10px;margin-bottom:8px}
.notes-lbl{font-size:9px;font-weight:700;color:#7a7830;text-transform:uppercase;letter-spacing:.8px;margin-bottom:4px}
.notes-txt{font-size:11px;color:#8a9050;line-height:1.65}
.tags-row{display:flex;gap:5px;flex-wrap:wrap}
.tag{background:#0d1a0d;border:1px solid #1a2a1a;border-radius:3px;padding:2px 7px;font-size:10px;color:#5aaa5a}
.json-wrap{background:#050810;border-radius:7px;padding:11px;overflow:auto;max-height:460px}
.json-out{font-family:'SF Mono','Consolas',monospace;font-size:10px;color:#4a8aaa;line-height:1.65;white-space:pre}
.copy-btn{background:#182030;border:1px solid #1e2a3a;color:#5a8aaa;font-size:11px;font-weight:700;padding:4px 10px;border-radius:5px;cursor:pointer;margin-bottom:8px}
.copy-btn:hover{background:#1e2a3a}
</style>
</head>
<body>
<div class="hdr">
  <div class="hdr-logo">📡</div>
  <div><div class="hdr-title">Sports Content Scanner v4</div><div class="hdr-sub">Scan → Package → Generate → Merge</div></div>
  <div class="hdr-right"><div class="dot live" id="sDot"></div><span class="stxt" id="sTxt">Ready</span></div>
</div>

<div class="cfg">
  <div class="cfg-row">
    <span class="cfg-lbl">HF API Key</span>
    <input class="cfg-inp" id="hfKey" type="password" placeholder="your-higgsfield-key">
    <span class="cfg-lbl" style="min-width:60px">HF Secret</span>
    <input class="cfg-inp" id="hfSecret" type="password" placeholder="your-higgsfield-secret">
  </div>
  <div class="cfg-row">
    <span class="cfg-lbl">Proxy URL</span>
    <input class="cfg-inp url" id="proxyUrl" type="text" placeholder="https://merry-trust-production-6868.up.railway.app">
    <button class="cfg-save" onclick="saveConfig()">Save</button>
    <span class="cfg-badge" id="cfgBadge"></span>
  </div>
</div>

<div class="wrap">
  <div class="sidebar">
    <div>
      <div class="sl">Sport</div>
      <div class="sport-grid">
        <button class="sport-btn active" data-sport="Football" onclick="setSport(this)"><span class="icon">⚽</span><span class="name">Football</span></button>
        <button class="sport-btn" data-sport="Basketball" onclick="setSport(this)"><span class="icon">🏀</span><span class="name">Basketball</span></button>
        <button class="sport-btn" data-sport="MMA" onclick="setSport(this)"><span class="icon">🥊</span><span class="name">MMA</span></button>
        <button class="sport-btn" data-sport="Cricket" onclick="setSport(this)"><span class="icon">🏏</span><span class="name">Cricket</span></button>
        <button class="sport-btn" data-sport="Tennis" onclick="setSport(this)"><span class="icon">🎾</span><span class="name">Tennis</span></button>
        <button class="sport-btn" data-sport="F1" onclick="setSport(this)"><span class="icon">🏎️</span><span class="name">F1</span></button>
      </div>
    </div>
    <div>
      <div class="sl">Category</div>
      <div class="cat-list">
        <button class="cat-btn active" data-cat="viral_moment" onclick="setCat(this)"><span class="ci">🔥</span><span class="cl">Viral Moment</span></button>
        <button class="cat-btn" data-cat="breaking_news" onclick="setCat(this)"><span class="ci">⚡</span><span class="cl">Breaking News</span></button>
        <button class="cat-btn" data-cat="match_highlights" onclick="setCat(this)"><span class="ci">🎬</span><span class="cl">Match Highlights</span></button>
        <button class="cat-btn" data-cat="emotional_story" onclick="setCat(this)"><span class="ci">💙</span><span class="cl">Emotional Story</span></button>
        <button class="cat-btn" data-cat="historical_record" onclick="setCat(this)"><span class="ci">🏆</span><span class="cl">Historical Record</span></button>
        <button class="cat-btn" data-cat="meme" onclick="setCat(this)"><span class="ci">😂</span><span class="cl">Meme</span></button>
        <button class="cat-btn" data-cat="prediction" onclick="setCat(this)"><span class="ci">🔮</span><span class="cl">Prediction</span></button>
        <button class="cat-btn" data-cat="trending" onclick="setCat(this)"><span class="ci">📈</span><span class="cl">Trending</span></button>
      </div>
    </div>
    <div>
      <div class="sl">Geo</div>
      <div class="geo-row">
        <button class="geo-btn" data-geo="Indonesia" onclick="setGeo(this)">🇮🇩 ID</button>
        <button class="geo-btn active" data-geo="Both" onclick="setGeo(this)">🌍 Both</button>
        <button class="geo-btn" data-geo="Global" onclick="setGeo(this)">🌐 GL</button>
      </div>
    </div>
    <button class="scan-btn" id="scanBtn" onclick="startScan()">📡 Scan Top Content</button>
  </div>

  <div class="main">
    <div class="phases">
      <div class="phase" id="ph1"><span class="phase-num">1</span>Scan</div>
      <div class="phase" id="ph2"><span class="phase-num">2</span>Events</div>
      <div class="phase" id="ph3"><span class="phase-num">3</span>Package</div>
      <div class="phase" id="ph4"><span class="phase-num">4</span>Generate</div>
    </div>
    <div class="content" id="mainContent">
      <div class="empty">
        <div class="empty-icon">📡</div>
        <div class="empty-title">Ready to scan</div>
        <div class="empty-sub">Enter Proxy URL → Save → pick sport + category → Scan</div>
      </div>
    </div>
  </div>
</div>

<script>
// ── STATE ────────────────────────────────────────────────────────────────────
const S = {
  sport:'Football', cat:'viral_moment', geo:'Both',
  proxyUrl:'', hfKey:'', hfSecret:'',
  events:[], pickedEvent:null, pkg:null,
  jobs:{},      // { idx: { imageUrl, requestId, status, videoUrl } }
  timers:{}     // { idx: intervalId }
};

// ── CONFIG ───────────────────────────────────────────────────────────────────

// ── SCAN ─────────────────────────────────────────────────────────────────────
async function startScan(){
  if(!S.proxyUrl){ alert('Set Proxy URL and click Save first'); return; }
  document.getElementById('scanBtn').disabled=true;
  setPhase(1); setSt('Scanning...');
  const logs=[
    {icon:'🌐',text:'Searching top '+S.sport+' content...'},
    {icon:'📊',text:'Analysing virality signals...'},
    {icon:'🎯',text:'Filtering: '+S.cat.replace(/_/g,' ')+'...'},
    {icon:'✅',text:'Ranking by viral potential...'}
  ];
  document.getElementById('mainContent').innerHTML=`<div class="phase-log">${logs.map((l,i)=>`<div class="log-item" id="log${i}"><div class="log-icon">${l.icon}</div><div class="log-text">${l.text}</div></div>`).join('')}</div>`;
  for(let i=0;i<logs.length;i++){
    const el=document.getElementById('log'+i);
    el.classList.add('active'); el.innerHTML+=`<div class="log-spin"></div>`;
    await sleep(800);
    el.classList.remove('active'); el.classList.add('done');
    el.querySelector('.log-spin').outerHTML='<div class="log-check">✓</div>';
  }
  const today=new Date().toISOString().split('T')[0];
  const prompt=`Search for the top 4 most viral or talked-about ${S.sport} events from the past 48 hours as of ${today}. Category: ${S.cat.replace(/_/g,' ')}. Geo: ${S.geo}.\n\nReturn ONLY a JSON array, no markdown, no explanation:\n[{"rank":1,"category":"${S.cat}","title":"Short title max 8 words","description":"Full factual description min 40 words","viral_score":85,"why_viral":"One sentence emotional trigger"}]`;
  try{
    const res=await fetch(S.proxyUrl+'/claude',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        model:'claude-sonnet-4-6',
        max_tokens:2000,
        tools:[{type:'web_search_20250305',name:'web_search'}],
        messages:[{role:'user',content:prompt}]
      })
    });
    const data=await res.json();
    const text=(data.content||[]).map(b=>b.text||'').join('');
    let events;
    try{ const m=text.replace(/```json|```/g,'').match(/\[[\s\S]*\]/); events=JSON.parse(m?m[0]:text); }
    catch(e){ events=[{rank:1,category:S.cat,title:'Parse failed — retry',description:'No results parsed.',viral_score:0,why_viral:'N/A'}]; }
    renderEvents(events);
  }catch(e){
    renderEvents([{rank:1,category:S.cat,title:'Error: '+e.message,description:e.message,viral_score:0,why_viral:'N/A'}]);
  }
}

function toggleSc(idx,row){ const cb=document.getElementById('hfsc'+idx); cb.checked=!cb.checked; row.classList.toggle('sel',cb.checked); }

async function sendAll(){
  if(!S.pkg) return;
  const scenes=S.pkg.higgsfield?.scenes||[];
  const selected=scenes.filter((_,i)=>{ const cb=document.getElementById('hfsc'+(i+1)); return cb&&cb.checked; });
  if(!selected.length){ alert('Select at least one scene'); return; }
  document.getElementById('sendBtn').disabled=true;

  // Build job UI
  document.getElementById('jobList').innerHTML=`
    <div style="margin-top:12px;font-size:10px;font-weight:700;color:#2a4a6a;text-transform:uppercase;letter-spacing:.8px;margin-bottom:8px">Generation Jobs</div>
    ${selected.map(s=>`
      <div class="job-box" id="jbox${s.scene_index}">
        <div class="job-hdr">
          <span class="job-scene">S${s.scene_index} · ${s.label.toUpperCase()}</span>
          <span class="job-stat q" id="jst${s.scene_index}">⏳ Queued</span>
          <a id="jlnk${s.scene_index}" class="job-link" style="display:none" target="_blank">▶ Watch</a>
        </div>
        <div id="jvwrap${s.scene_index}" style="display:none;margin-bottom:6px">
          <video id="jv${s.scene_index}" class="job-video" controls playsinline></video>
        </div>
        <textarea id="jpr${s.scene_index}" class="job-prompt">${s.prompt}</textarea>
        <button class="regen-btn" onclick="regenScene(${s.scene_index})">↺ Regenerate</button>
      </div>`).join('')}`;

  // Send sequentially
  for(const s of selected){
    await processScene(s);
    await sleep(1500);
  }
  document.getElementById('sendBtn').disabled=false;
  checkMerge();
}

async function processScene(scene){
  const idx=scene.scene_index;
  const aspect=S.pkg.higgsfield?.aspect_ratio||'9:16';
  const prompt=document.getElementById('jpr'+idx)?.value||scene.prompt;

  setJobSt(idx,'p','Step 1/2: Generating image…');

  // STEP 1: Soul Cinema
  try{
    const r=await fetch(S.proxyUrl+'/generate-image',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({prompt,aspect_ratio:aspect})
    });
    const d=await r.json();
    if(!r.ok){ setJobSt(idx,'fail','✗ Image: '+(d.error||r.status)); return; }
    const imageUrl=d.url||(d.images&&d.images[0]&&d.images[0].url)||null;
    if(!imageUrl){ setJobSt(idx,'fail','✗ No image URL'); return; }
    S.jobs[idx]={imageUrl,status:'img_done'};
  }catch(e){ setJobSt(idx,'fail','✗ '+e.message); return; }

  // STEP 2: DoP Standard
  setJobSt(idx,'p','Step 2/2: Animating video…');
  try{
    const r=await fetch(S.proxyUrl+'/generate-video',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({image_url:S.jobs[idx].imageUrl,prompt,aspect_ratio:aspect})
    });
    const d=await r.json();
    if(!r.ok){ setJobSt(idx,'fail','✗ Video: '+(d.error||d.detail||r.status)); return; }
    const reqId=d.request_id||d.id;
    if(!reqId){ setJobSt(idx,'fail','✗ No request_id'); return; }
    S.jobs[idx]={...S.jobs[idx],requestId:reqId,status:'polling'};
    setJobSt(idx,'p','Generating… 0s');
    startPoll(idx,reqId);
  }catch(e){ setJobSt(idx,'fail','✗ '+e.message); }
}

function startPoll(idx,reqId){
  let elapsed=0;
  const timer=setInterval(async()=>{
    elapsed+=5;
    try{
      const r=await fetch(S.proxyUrl+'/status/'+reqId);
      const d=await r.json();
      const status=d.status||'';
      if(status==='completed'){
        clearInterval(timer);
        const url=d._video_url||(d.video&&d.video.url)||(d.output&&d.output.url)||'';
        S.jobs[idx]={...S.jobs[idx],status:'done',videoUrl:url};
        setJobSt(idx,'ok','✓ Ready');
        if(url){
          // Show link
          const lnk=document.getElementById('jlnk'+idx);
          if(lnk){ lnk.href=url; lnk.style.display='inline'; }
          // Show inline video
          const vwrap=document.getElementById('jvwrap'+idx);
          const vid=document.getElementById('jv'+idx);
          if(vwrap&&vid){ vid.src=url; vwrap.style.display='block'; }
        }
        checkMerge();
      } else if(status==='failed'||status==='nsfw'||status==='cancelled'){
        clearInterval(timer);
        S.jobs[idx]={...S.jobs[idx],status:'failed'};
        setJobSt(idx,'fail','✗ '+status);
      } else {
        setJobSt(idx,'p','Generating… '+elapsed+'s');
      }
    }catch(e){}
    if(elapsed>=300){ clearInterval(timer); setJobSt(idx,'fail','Timed out'); }
  },5000);
  S.timers[idx]=timer;
}

async function regenScene(idx){
  const scene=S.pkg?.higgsfield?.scenes?.find(s=>s.scene_index===idx);
  if(!scene) return;
  // Clear old state
  if(S.timers[idx]){ clearInterval(S.timers[idx]); delete S.timers[idx]; }
  S.jobs[idx]={};
  const vwrap=document.getElementById('jvwrap'+idx);
  const lnk=document.getElementById('jlnk'+idx);
  if(vwrap) vwrap.style.display='none';
  if(lnk) lnk.style.display='none';
  setJobSt(idx,'q','↺ Regenerating…');
  await processScene(scene);
  checkMerge();
}

function setJobSt(idx,cls,text){
  const el=document.getElementById('jst'+idx);
  if(el){ el.className='job-stat '+cls; el.textContent=text; }
}

function checkMerge(){
  const done=Object.values(S.jobs).filter(j=>j.status==='done'&&j.videoUrl);
  const mb=document.getElementById('mergeBox');
  if(mb&&done.length>0) mb.style.display='block';
}

// ── MERGE ─────────────────────────────────────────────────────────────────────
async function doMerge(){
  const btn=document.getElementById('mergeBtn');
  const status=document.getElementById('mergeStatus');
  btn.disabled=true;

  const videoUrls=Object.keys(S.jobs)
    .sort((a,b)=>Number(a)-Number(b))
    .map(k=>S.jobs[k].videoUrl)
    .filter(u=>u&&u.includes('.mp4'));

  if(!videoUrls.length){ status.textContent='No ready videos.'; btn.disabled=false; return; }

  status.innerHTML=`<span style="display:inline-flex;align-items:center;gap:5px"><span class="jspin"></span>Merging ${videoUrls.length} clips… may take 1-2 min</span>`;

  try{
    const r=await fetch(S.proxyUrl+'/merge',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({video_urls:videoUrls,content_id:S.pkg?.content_id||'final'})
    });
    if(!r.ok){ const e=await r.json().catch(()=>({})); status.textContent='✗ Merge failed: '+(e.error||r.status); btn.disabled=false; return; }
    const blob=await r.blob();
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a'); a.href=url; a.download=(S.pkg?.content_id||'final')+'.mp4'; a.click();
    status.innerHTML='✓ <strong style="color:#4adb6a">Downloading!</strong>';
    btn.disabled=false;
  }catch(e){ status.textContent='✗ '+e.message; btn.disabled=false; }
}

// ── UTILS ─────────────────────────────────────────────────────────────────────
function switchTab(name,el){
  document.querySelectorAll('.otab').forEach(t=>t.classList.remove('active')); el.classList.add('active');
  document.querySelectorAll('.out-panel').forEach(p=>p.classList.remove('active'));
  document.getElementById('op-'+name).classList.add('active');
}
function copyJSON(){
  if(!S.pkg) return;
  navigator.clipboard.writeText(JSON.stringify(S.pkg,null,2));
  const b=document.querySelector('.copy-btn'); b.textContent='✓ Copied!'; setTimeout(()=>b.textContent='⧉ Copy JSON',2000);
}
